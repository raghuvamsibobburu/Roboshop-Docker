networks:
  default:
    driver: bridge
    name: roboshop

services:
  mongodb:
    image: raghuvamsi/mongo:v1
    container_name: mongo
  catalogue:
    image: raghuvamsi/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  redis:
    image: raghuvamsi/redis:v1
    container_name: redis
  user:
    image: raghuvamsi/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
  cart:
    image: raghuvamsi/cart:v1
    container_name: cart
    depends_on:
    - redis
    - catalogue
  mysql:
    image: raghuvamsi/mysql:v1
    container_name: mysql
  shipping:
    image: raghuvamsi/shipping:v1
    container_name: shipping
    depends_on:
    - cart
    - mysql
  rabbitmq:
    image: rabbit:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFALUT_USER: roboshop
      RABBITMQ_DEFALUT_PASS: roboshop123
  payment:
    image: raghuvamsi/payment:v1
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - cart
    - user
    - rabbitmq
  frontend:
    image: raghuvamsi/frontend:v1
    container_name: frontend
    ports:
    - 80:80
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment
